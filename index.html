<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>코디세이 Q&amp;A 허브</title>
  <meta name="description" content="디스코드에 자주 올라오는 문의와 공지를 한곳에 정리한 코디세이 교육생 안내 페이지">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#main">본문 바로가기</a>

  <header class="topbar">
    <div class="wrap">
      <button class="icon-btn" type="button" id="topSearch" aria-label="자주 묻는 질문 검색">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.8-4.8"/></svg>
      </button>
      <a class="icon-btn" href="#notice" aria-label="새 공지 3건">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 22a2.5 2.5 0 0 0 2.45-2h-4.9A2.5 2.5 0 0 0 12 22Zm7-6V11a7 7 0 0 0-5.5-6.84V3.5a1.5 1.5 0 0 0-3 0v.66A7 7 0 0 0 5 11v5l-2 2v1h18v-1l-2-2Z"/></svg>
        <span class="count" aria-hidden="true">3</span>
      </a>
    </div>
  </header>

  <div class="wrap">
    <div class="page-head">
      <h1 class="page-title" id="pageTitle">한눈에 보기</h1>
      <nav class="breadcrumb" aria-label="현재 위치">
        <ol id="crumbs"></ol>
      </nav>
      <div class="tabs" role="tablist" aria-label="메뉴">
        <button class="tab" role="tab" id="tab-home" data-route="home" aria-controls="main">한눈에 보기</button>
        <button class="tab" role="tab" id="tab-faq" data-route="faq" aria-controls="main">자주 묻는 질문</button>
        <button class="tab" role="tab" id="tab-notice" data-route="notice" aria-controls="main">공지사항</button>
      </div>
    </div>

    <main id="main" tabindex="-1" role="tabpanel" aria-live="polite"></main>
  </div>

  <footer class="footer">
    <div class="wrap">
      <p>디스코드 문의 채널에 올라온 질문을 운영진이 정리했습니다. 마지막 정리일 <span id="updatedAt"></span></p>
      <p>이 페이지는 목업이며, 표시된 내용은 예시입니다.</p>
    </div>
  </footer>

  <!-- 챗봇 -->
  <button class="chat-fab" type="button" id="chatOpen" aria-haspopup="dialog" aria-controls="chat">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-4.9A8 8 0 1 1 21 12Z"/><path d="M8.5 12h.01M12 12h.01M15.5 12h.01"/></svg>
    <span class="label">무엇이든 물어보세요</span>
    <span class="sr-only">안내 챗봇 열기</span>
  </button>
  <div class="scrim" id="scrim" hidden></div>
  <section class="chat" id="chat" role="dialog" aria-modal="true" aria-labelledby="chatTitle" hidden>
    <div class="chat-handle" aria-hidden="true"></div>
    <div class="chat-head">
      <span class="bot-avatar" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="16" height="12" rx="3"/><path d="M12 4v4M9 13h.01M15 13h.01M9.5 16.5h5"/></svg>
      </span>
      <div>
        <h2 id="chatTitle">Q&amp;A 안내 챗봇</h2>
        <p>정리된 질문과 공지에서 답을 찾아 드립니다.</p>
      </div>
      <button class="icon-btn" type="button" id="chatClose" aria-label="챗봇 닫기">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="chat-log" id="chatLog" role="log" aria-live="polite"></div>
    <div class="chat-suggest">
      <div class="chips scroll" id="chatChips" aria-label="추천 질문"></div>
    </div>
    <form class="chat-form" id="chatForm" autocomplete="off">
      <label class="sr-only" for="chatInput">질문 입력</label>
      <input id="chatInput" type="text" placeholder="예: 지각 몇 번까지 괜찮아요?" maxlength="200">
      <button class="btn btn-primary" type="submit" id="chatSend" aria-label="보내기" disabled>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </form>
  </section>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
