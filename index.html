<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>코디세이 Q&amp;A 허브</title>
  <meta name="description" content="공지, 자주 묻는 질문, 시험 안내를 한곳에서 찾아보세요. 교육생이 디스코드 공지와 안내 자료를 정리한 비공식 페이지입니다.">
  <link rel="icon" href="assets/logo.svg?v=1" type="image/svg+xml">
  <link rel="icon" href="assets/favicon-32.png?v=1" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png?v=1">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="manifest.webmanifest">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="코디세이 Q&amp;A 허브">
  <meta property="og:locale" content="ko_KR">
  <meta property="og:url" content="https://sangukjeon.github.io/Codyssey_QnA/">
  <meta property="og:title" content="코디세이 Q&amp;A 허브 (비공식)">
  <meta property="og:description" content="공지, 자주 묻는 질문, 시험 안내를 한곳에서 찾아보세요. 교육생이 디스코드 공지와 안내 자료를 정리한 비공식 페이지입니다.">
  <meta property="og:image" content="https://sangukjeon.github.io/Codyssey_QnA/assets/og-image.png?v=2">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="코디세이 Q&amp;A 허브 — 공지, 자주 묻는 질문, 시험 안내를 한곳에서">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
  <link rel="stylesheet" href="css/style.css?v=20261110-3">
</head>
<body>
  <a class="skip-link" href="#main">본문 바로가기</a>

  <header class="head">
    <div class="wrap">
      <div class="brand-row">
        <a class="logo" href="#home" aria-label="Codyssey Q&amp;A 허브, 한눈에 보기로 이동">
          <img src="assets/codyssey-logo-h.png" alt="" width="102" height="22">
          <span class="brand-sep" aria-hidden="true"></span>
          <span class="brand-name">Q&amp;A 허브</span>
        </a>
      </div>
      <h1 class="sr-only" id="pageTitle">한눈에 보기</h1>
      <div class="tabs" role="tablist" aria-label="메뉴">
        <button class="tab" role="tab" id="tab-home" data-route="home" aria-controls="main">한눈에 보기</button>
        <button class="tab" role="tab" id="tab-faq" data-route="faq" aria-controls="main">자주 묻는 질문</button>
        <button class="tab" role="tab" id="tab-notice" data-route="notice" aria-controls="main">공지사항</button>
        <span class="tab-bar" aria-hidden="true"></span>
      </div>
    </div>
  </header>

  <div class="wrap">

    <main id="main" tabindex="-1" role="tabpanel"></main>
  </div>

  <footer class="footer">
    <div class="wrap">
      <div class="notice-box" role="note">
        <p><b>코디세이 공식 사이트가 아닙니다.</b></p>
        <p>교육생이 디스코드 공지와 오리엔테이션·시험 안내 자료를 개인적으로 정리한 비공식 페이지입니다. 내용이 다르면 원문 공지와 운영진 안내를 따라 주세요.</p>
        <p>문제가 되는 내용이 있거나 운영진의 요청이 있으면 바로 수정하거나 사이트를 삭제합니다.</p>
        <p>사이트 개선을 위해 쿠키 없이 개인을 식별하지 않는 익명 방문 통계(조회·클릭 수)를 수집합니다. 챗봇에 입력한 문장은 저장하지 않습니다.</p>
      </div>
    </div>
  </footer>

  <!-- 챗봇 -->
  <button class="chat-fab" type="button" id="chatOpen" aria-haspopup="dialog" aria-controls="chat">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/><circle cx="8" cy="12" r="1.15" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.15" fill="currentColor" stroke="none"/><circle cx="16" cy="12" r="1.15" fill="currentColor" stroke="none"/></svg>
    <span class="label">무엇이든 물어보세요</span>
    <span class="sr-only">안내 챗봇 열기</span>
  </button>
  <div class="scrim" id="scrim" hidden></div>
  <section class="chat" id="chat" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="chatTitle" hidden>
    <div class="chat-handle" aria-hidden="true"></div>
    <div class="chat-head">
      <span class="bot-avatar" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="16" height="12" rx="3"/><path d="M12 4v4M9.5 16.5h5"/><circle cx="9" cy="13" r="1.15" fill="currentColor" stroke="none"/><circle cx="15" cy="13" r="1.15" fill="currentColor" stroke="none"/></svg>
      </span>
      <div>
        <h2 id="chatTitle">Q&amp;A 안내 챗봇</h2>
        <p>정리된 질문과 공지에서 찾아 드립니다</p>
      </div>
      <button class="icon-btn" type="button" id="chatClose" aria-label="챗봇 닫기">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="chat-log" id="chatLog" role="log" aria-live="polite"></div>
    <div class="chat-suggest">
      <div class="chips scroll" id="chatChips" aria-label="추천 질문"></div>
    </div>
    <form class="chat-form" id="chatForm" autocomplete="off">
      <label class="sr-only" for="chatInput">질문 입력</label>
      <input id="chatInput" type="text" placeholder="예: 와이파이 비밀번호 알려 주세요" maxlength="200">
      <button class="btn btn-primary" type="submit" id="chatSend" aria-label="보내기" disabled>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </form>
  </section>

  <!-- 방문 통계: Umami (쿠키 없음, 개인 식별 안 함). 실제 사이트 주소에서만 수집 -->
  <script defer id="umami" src="https://cloud.umami.is/script.js" data-website-id="78b52595-de22-4f75-b92c-4f10ca1a968a" data-auto-track="false" data-domains="sangukjeon.github.io"></script>
  <script src="js/analytics.js?v=20261110-3"></script>
  <script src="js/data.js?v=20261110-3"></script>
  <script src="js/matcher.js?v=20261110-3"></script>
  <script src="js/app.js?v=20261110-3"></script>
  <script>
    // 설치(앱으로 추가) 지원용 서비스 워커 — 캐시는 하지 않는다
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  </script>
</body>
</html>
